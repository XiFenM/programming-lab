# Keep native build output on a Linux filesystem even when the repository is a
# Windows bind mount.
services:
  dev:
    tmpfs:
      - /workspace/programming-lab/build:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0775
      - /workspace/programming-lab/target:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=0775
