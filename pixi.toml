[workspace]
name = "programming-lab-host"
version = "0.1.0"
description = "Repository-local CPU and CUDA toolchains for programming practice"
channels = ["nvidia", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
uv = ">=0.11,<0.12"
cxx-compiler = ">=1.11,<3"
cmake = ">=3.28,<4"
ninja = ">=1.12,<2"
ccache = ">=4.10,<5"
clang-format = "18.*"
shellcheck = ">=0.10,<1"
ripgrep = ">=14,<16"
make = ">=4.4,<5"

[feature.gpu.dependencies]
cuda-toolkit = "13.0.3.*"
cudnn = "==9.20.0.48"
clang = "18.*"
clang-tools = "18.*"
gdb = ">=16,<18"
lldb = "19.1.7.*"
nodejs = "24.*"

[environments]
gpu = ["gpu"]
