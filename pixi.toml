[workspace]
name = "programming-lab-host-cpu"
version = "0.1.0"
description = "Repository-local CPU-only toolchain for LeetCode practice"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
uv = ">=0.11,<0.12"
cxx-compiler = ">=1.11,<3"
cmake = ">=3.28,<4"
ninja = ">=1.12,<2"
ccache = ">=4.10,<5"
clang-format = "18.*"
shellcheck = ">=0.10,<1"
ripgrep = ">=14,<16"
make = ">=4.4,<5"
