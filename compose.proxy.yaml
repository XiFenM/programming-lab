# Enable the v2rayA Lite sidecar and expose its explicit proxy settings to the
# development container. Pair this file with one proxy persistence override.
services:
  dev:
    ports:
      - "${V2RAYA_WEB_BIND_ADDRESS:-127.0.0.1}:${V2RAYA_WEB_PORT:-2017}:2017"
    environment:
      PROGRAMMING_LAB_PROXY_MODE: proxy
      V2RAYA_HTTP_PROXY: ${V2RAYA_HTTP_PROXY:-http://127.0.0.1:20171}
      V2RAYA_SOCKS_PROXY: ${V2RAYA_SOCKS_PROXY:-socks5h://127.0.0.1:20170}
      V2RAYA_NO_PROXY: ${V2RAYA_NO_PROXY:-localhost,127.0.0.1,::1}
      CODEX_HTTP_PROXY: ${CODEX_HTTP_PROXY:-}
      CODEX_SOCKS_PROXY: ${CODEX_SOCKS_PROXY:-}
      CODEX_NO_PROXY: ${CODEX_NO_PROXY:-}
      HTTP_PROXY: ${V2RAYA_HTTP_PROXY:-http://127.0.0.1:20171}
      HTTPS_PROXY: ${V2RAYA_HTTP_PROXY:-http://127.0.0.1:20171}
      ALL_PROXY: ${V2RAYA_SOCKS_PROXY:-socks5h://127.0.0.1:20170}
      NO_PROXY: ${V2RAYA_NO_PROXY:-localhost,127.0.0.1,::1}
      http_proxy: ${V2RAYA_HTTP_PROXY:-http://127.0.0.1:20171}
      https_proxy: ${V2RAYA_HTTP_PROXY:-http://127.0.0.1:20171}
      all_proxy: ${V2RAYA_SOCKS_PROXY:-socks5h://127.0.0.1:20170}
      no_proxy: ${V2RAYA_NO_PROXY:-localhost,127.0.0.1,::1}

  # v2rayA runs as an isolated Lite-mode sidecar but shares dev's network
  # namespace. Processes in dev can therefore use 127.0.0.1:20170/20171
  # without granting either container NET_ADMIN or privileged mode.
  proxy:
    image: ${V2RAYA_IMAGE:-mzz2017/v2raya:latest}
    init: true
    restart: unless-stopped
    network_mode: service:dev
    depends_on:
      dev:
        condition: service_started
    command:
      - --lite
      - --config
      - /etc/v2raya
      - --log-level
      - ${V2RAYA_LOG_LEVEL:-info}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
