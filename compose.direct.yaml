# Force a direct runtime network mode. Explicit empty values also prevent a
# host Docker client proxy configuration from leaking into the dev container.
services:
  dev:
    environment:
      PROGRAMMING_LAB_PROXY_MODE: direct
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
